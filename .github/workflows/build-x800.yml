name: build-x800

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Build SM-X800 payloads
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make TARGET=gts8p-X800ZCSBEZH3
          find build/gts8p-X800ZCSBEZH3 -type f -ls

      - uses: actions/upload-artifact@v4
        with:
          name: x800-root-umh
          path: build/gts8p-X800ZCSBEZH3/*
          if-no-files-found: error
